<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurant System Map</title>
<meta name="description" content="A 60-second check that maps your restaurant from supply to management and shows which parts run on a system and which run on someone's memory.">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:type" content="website">
<meta property="og:title" content="Does your restaurant run on a system, or on people?">
<meta property="og:description" content="A free 60-second check that maps your restaurant from supply to management. No sales figures asked.">
<meta property="og:url" content="https://abhishekand1111-prog.github.io/system-map/">
<meta property="og:image" content="https://abhishekand1111-prog.github.io/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F4F4;
    --ink:#000000; --ink-600:#4B4B4B; --ink-400:#8A8A8A;
    --line:#E6E6E6; --line-strong:#C9C9C9; --dot:#DCDCDC;
    --warn:#B26B00; --bad:#C1392B;
    --r-s:8px; --r-m:12px; --r-l:18px;
    --font:'Inter',-apple-system,"Segoe UI",sans-serif;
    --mono:'IBM Plex Mono',Consolas,monospace;
  }
  /* Always white with black, to match the brand (no dark variant). */
  :root{ color-scheme:light; }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
  html,body{background:var(--paper); margin:0; overflow-x:clip;}
  body{color:var(--ink); font-family:var(--font); line-height:1.5; -webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font-family:var(--font); font-size:16px;}
  button{cursor:pointer;}
  h1,h2,h3{margin:0; letter-spacing:-0.015em; text-wrap:balance;}
  .shell{max-width:720px; margin:0 auto; padding:20px 16px 48px; min-height:100vh;}
  .top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:26px;}
  .top{padding-bottom:14px; border-bottom:1px solid var(--line);}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:15px; color:var(--ink); text-decoration:none;}
  .brand img{height:26px; width:auto; display:block;}
  .brand span{color:var(--ink-400); font-weight:600;}
  .toplink{font-size:13.5px; font-weight:600; color:var(--ink-600); text-decoration:none;}
  .toplink:hover{color:var(--ink);}
  .hero{position:relative;}
  .hero h1{font-size:34px; line-height:1.12;}
  @media (max-width:460px){ .hero h1{font-size:29px;} }
  .trust{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:14px; font-size:13px; color:var(--ink-600);}
  .trust span{display:inline-flex; align-items:center; gap:6px;}
  .trust svg, .perks svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none;}
  .card{border:1.5px solid var(--ink); border-radius:var(--r-l); padding:20px 20px 18px; margin-top:18px; background:var(--surface);}
  .perks{list-style:none; padding:0; margin:12px 0 0;}
  .perks li{display:flex; gap:10px; align-items:flex-start; font-size:14.5px; color:var(--ink-600); margin-top:8px; line-height:1.45;}
  .perks li svg{margin-top:3px; color:var(--ink);}
  .after{display:flex; justify-content:center; gap:6px 20px; flex-wrap:wrap; margin-top:12px;}
  .eyebrow{font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-400);}
  .lead{color:var(--ink-600); font-size:16px; margin:10px 0 0;}
  .muted{color:var(--ink-400); font-size:13px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); font-weight:600; border-radius:var(--r-m); padding:12px 20px; min-height:50px; transition:background .15s, opacity .15s;}
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .btn-primary:hover{background:var(--ink); opacity:.86;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn-text{border:none; background:none; color:var(--ink-600); padding:8px 2px; min-height:auto; font-weight:600; font-size:14px;}
  .btn-text:hover{background:none; color:var(--ink);}
  a.btn-text{text-decoration:none;}
  .cta{display:flex; justify-content:center; margin-top:26px;}
  .cta .btn{min-width:300px;}
  @media (max-width:460px){ .cta .btn{width:100%; min-width:0;} }

  /* questions */
  .progress{height:3px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:18px;}
  .progress i{display:block; height:3px; background:var(--ink); transition:width .25s ease;}
  .qhead{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .qtext{font-size:23px; font-weight:800; line-height:1.3; margin:8px 0 16px;}
  .opt{display:block; position:relative; width:100%; text-align:left; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:var(--r-m); padding:15px 16px 15px 50px; margin-top:10px; font-size:16px; line-height:1.4; transition:border-color .12s, background .12s, transform .12s, box-shadow .12s;}
  .opt::before{content:""; position:absolute; left:17px; top:50%; width:18px; height:18px; margin-top:-9px; border-radius:50%; border:1.5px solid var(--line-strong); background:var(--surface); box-sizing:border-box;}
  .opt:hover{border-color:var(--ink); box-shadow:0 2px 0 var(--ink);}
  .opt:active{transform:translateY(1px); box-shadow:none;}
  .opt.on{border-color:var(--ink); background:var(--ink); color:var(--paper); font-weight:600;}
  .opt.on::before{border-color:var(--paper); background:radial-gradient(circle, var(--paper) 0 4px, transparent 4.5px);}
  .opt b{display:block; font-size:16px;}
  .opt span{display:block; font-size:13px; color:var(--ink-600); margin-top:2px;}
  .opt.on span{color:var(--paper); opacity:.75;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:9px 15px; font-size:14.5px; font-weight:500;}
  .chip.on{border-color:var(--ink); background:var(--ink); color:var(--paper);}
  .sublab{font-size:12px; font-weight:600; color:var(--ink-400); text-transform:uppercase; letter-spacing:.05em; margin:20px 0 8px;}
  label.f{display:block; font-size:13px; font-weight:600; color:var(--ink-600); margin:16px 0 6px;}
  input.t{width:100%; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); border-radius:var(--r-s); padding:11px 12px; min-height:50px;}
  input.t:focus{outline:none; border-color:var(--ink);}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:460px){ .two{grid-template-columns:1fr;} }
  .err{color:var(--bad); font-size:13px; margin-top:6px;}

  /* report */
  .report-head{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:10px;}
  .level{display:flex; align-items:center; gap:14px; margin-top:18px;}
  .meter{display:flex; gap:4px; flex:none;}
  .meter i{width:26px; height:8px; border-radius:2px; background:var(--line);}
  .meter i.on{background:var(--ink);}
  .level .lv{font-size:26px; font-weight:800; line-height:1.2;}
  @media (max-width:460px){ .level .lv{font-size:22px;} }
  .finding{display:flex; gap:10px; align-items:flex-start; margin-top:12px; font-size:15.5px; line-height:1.45;}
  .finding .dot{margin-top:7px;}
  .finding b{font-weight:700;}
  .legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:14px; font-size:13px; color:var(--ink-600);}
  .legend span{display:inline-flex; align-items:center; gap:7px;}
  .dot{width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; background:var(--ink-400);}
  .dot.bad{background:var(--bad);} .dot.warn{background:var(--warn);}
  .dot.ok{background:none; border:1.5px solid var(--ink-400);}
  .sample-tag{display:inline-block; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--ink); border-radius:4px; padding:2px 7px;}

  /* hierarchy board */
  .board{--bw:min(calc(100vw - 32px), 1240px); width:var(--bw); margin:20px 0 0 calc((100% - var(--bw)) / 2);
    border:1px solid var(--line); border-radius:var(--r-l); padding:26px 18px;
    background-color:var(--paper); background-image:radial-gradient(var(--dot) 1.2px, transparent 1.2px); background-size:18px 18px;}
  .n{background:var(--surface); border:1.5px solid var(--line-strong); border-radius:var(--r-s); padding:9px 11px; position:relative;}
  .n .t1{font-weight:700; font-size:13.5px; line-height:1.25;}
  .n .t2{font-size:11.5px; color:var(--ink-400); font-weight:600; margin-top:3px; line-height:1.3;}
  .n.root{background:var(--ink); border-color:var(--ink); color:var(--paper); border-radius:999px; padding:11px 22px; text-align:center;}
  .n.root .t1{font-size:15px;} .n.root .t2{color:var(--paper); opacity:.65;}
  .n.dept{border-color:var(--ink); border-radius:var(--r-m); text-align:center; padding:9px 14px;}
  .n.dept .t1{text-transform:uppercase; letter-spacing:.05em; font-size:12.5px;}
  .n.area.s-person{border-color:var(--warn);} .n.area.s-person .t2{color:var(--warn);}
  .n.area.s-missing{border-color:var(--bad);} .n.area.s-missing .t2{color:var(--bad);}
  .n.leaf{border-width:1px; border-color:var(--line);}
  .n.leaf .t2{font-size:12px; color:var(--ink-600); font-weight:400; margin:0;}
  .cnt .bad{color:var(--bad);} .cnt .warn{color:var(--warn);}

  .hwrap{position:relative; overflow:hidden;}
  .ht{position:relative; width:1134px; display:grid; grid-template-columns:repeat(7,150px); column-gap:14px; transform-origin:0 0;}
  .ht svg.wires{position:absolute; left:0; top:0; overflow:visible; pointer-events:none;}
  .ht .wires path{fill:none; stroke:var(--line-strong); stroke-width:1.5;}
  .ht .rootcell{grid-column:1 / -1; display:flex; justify-content:center; margin-bottom:46px;}
  .ht .deptcell{display:flex; justify-content:center; margin-bottom:46px;}
  .ht .deptcell .n{min-width:140px; max-width:100%;}
  .ht .areacell{display:flex; flex-direction:column;}
  .ht .leafwrap{margin-left:14px; position:relative; padding-top:12px;}
  .ht .leafwrap::before{content:""; position:absolute; left:-9px; top:0; height:30px; width:9px; border-left:1.5px solid var(--line-strong); border-bottom:1.5px solid var(--line-strong); border-bottom-left-radius:6px;}

  .vt .kids{margin-left:13px;}
  .vt .item{position:relative; padding:10px 0 0 22px;}
  .vt .item::before{content:""; position:absolute; left:0; top:0; height:30px; width:16px; border-left:1.5px solid var(--line-strong); border-bottom:1.5px solid var(--line-strong); border-bottom-left-radius:8px;}
  .vt .item:not(:last-child)::after{content:""; position:absolute; left:0; top:30px; bottom:0; border-left:1.5px solid var(--line-strong);}
  .vt .n.root, .vt .n.dept{display:inline-block; text-align:left;}
  .vt .n.area{display:inline-block; min-width:220px; max-width:100%;}
  .vt .n.leaf{display:inline-block; max-width:100%;}

  .done-ic{width:52px; height:52px; border-radius:50%; border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
  .fine{font-size:12px; color:var(--ink-400); margin-top:32px; text-align:center;}
  .fade{animation:fade .22s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><a class="brand" href="../"><img src="../assets/dr-mark.png" alt="" width="22" height="26">Diagnosis Room <span>· System Map</span></a><a class="toplink" href="../">About us</a></div>
  <div id="app"></div>
  <div class="fine">Answers are saved anonymously. Your number is only saved if you book a call.</div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  /* =====================================================================
     CONTENT — edit this block to change what is shown and asked.
     Everything below the "ENGINE" line works from this data.
     ===================================================================== */

  var FORMATS = {
    dinein: { label:'Dine-in restaurant', hint:'Tables, servers, a full kitchen' },
    qsr:    { label:'QSR / quick service', hint:'Counter or pickup, fast turnaround' },
    cloud:  { label:'Cloud kitchen',      hint:'Delivery-only, orders through apps' }
  };

  // The hierarchy: restaurant → department → area. A department name can differ by format.
  var DEPTS = [
    { id:'supply',  name:'Supply',     areas:['purchase','storage'] },
    { id:'kitchen', name:'Kitchen',    areas:['prep','kitchen'] },
    { id:'front',   name:{ dinein:'Front of house', qsr:'Counter', cloud:'Delivery' }, areas:['service'] },
    { id:'mgmt',    name:'Management', areas:['cash','review'] }
  ];

  // One question per area (placeholder wording — to be finalised).
  // Each option is [level, text]: 0 = nobody handles it, 1 = works because someone remembers, 2 = runs on a system.
  // Keep options out of level order so there is no obvious "right" position.
  // An area can have a different name/question per format via byFormat (a string value reuses another format's).
  var AREAS = [
    { id:'purchase', name:'Purchase', risk:'Buying isn\'t controlled by stock levels or agreed rates.',
      q:'How do you decide what to order, and how much?', opts:[
        [0,'Someone notices we\'re running low and orders'],
        [2,'Stock is counted and we order up to a fixed level'],
        [1,'The chef or manager decides from experience'] ]},
    { id:'storage', name:'Receiving & storage', risk:'Nobody can say what stock you should have on the shelf.',
      q:'How do you know what\'s in stock right now?', opts:[
        [1,'The chef or storekeeper just knows'],
        [2,'It\'s counted on fixed days and matched against usage'],
        [0,'We find out when something runs out'] ]},
    { id:'prep', name:'Prep', risk:'Daily prep isn\'t tied to expected sales, so wastage goes unmeasured.',
      q:'How is the day\'s prep quantity decided?', opts:[
        [1,'The chef decides each morning'],
        [0,'Roughly the same every day'],
        [2,'A prep list based on expected sales'] ]},
    { id:'kitchen', name:'Cooking & portions', risk:'Portions aren\'t fixed, so food cost moves with whoever is cooking.',
      q:'How is a portion decided in your kitchen?', opts:[
        [0,'The chef judges by eye'],
        [1,'We have measurements, but they\'re not always followed'],
        [2,'Weighed every time against a written recipe'] ]},
    { id:'service', byFormat:{
      dinein:{ name:'Floor service', risk:'The floor runs on whoever is directing it that night.',
        q:'It\'s a busy Saturday night. How does the floor run?', opts:[
          [1,'The manager or captain directs everyone as it happens'],
          [2,'Each server has a fixed section and set steps'],
          [0,'Staff figure it out as tables come in'] ]},
      qsr:{ name:'Counter & pickup', risk:'Nobody knows how long orders really take at peak.',
        q:'How do you know how long an order takes from order to handover?', opts:[
          [1,'The manager pushes the line when it feels slow'],
          [0,'We don\'t really track it'],
          [2,'Order times are tracked against a target'] ]},
      cloud:{ name:'Packing & dispatch', risk:'Packing depends on memory, which shows up as missing-item refunds.',
        q:'How does a packer know what goes into each order?', opts:[
          [1,'The senior packer knows'],
          [2,'Each item has a packing standard, checked before handover'],
          [0,'They pack what\'s on the ticket as best they can'] ]}
    }},
    { id:'cash', byFormat:{
      dinein:{ name:'Billing & cash', risk:'Nobody checks bills and cash against kitchen orders.',
        q:'How do you know every order was billed?', opts:[
          [2,'Each kitchen ticket is matched to a bill, and voids need approval'],
          [1,'I check when I\'m there'],
          [0,'We trust the cashier'] ]},
      qsr:'dinein',
      cloud:{ name:'Payouts & offers', risk:'App payouts aren\'t matched against orders, commissions and refunds.',
        q:'How do you know app payouts are correct?', opts:[
          [0,'We accept what the app pays'],
          [1,'Our accountant looks at it sometimes'],
          [2,'Each payout is matched against orders, commissions and refunds'] ]}
    }},
    { id:'review', name:'Review & people', risk:'Cost problems surface months late, if at all.',
      q:'How would you know if food cost went up last month?', opts:[
        [0,'Only when money feels tight'],
        [2,'Food cost % is worked out every month from purchases and stock'],
        [1,'Gut feel, or the accountant says so at year end'] ]}
  ];

  // Last question: the key-person test.
  var KEY_PEOPLE = [
    { id:'chef',    label:'Head chef', ask:'If your head chef was away for a week, what would slip?', line:'If your head chef is away for a week' },
    { id:'manager', label:'Manager',   ask:'If your manager was away for a week, what would slip?',   line:'If your manager is away for a week' },
    { id:'owner',   label:'Me',        ask:'If you were away for a week, what would slip?',           line:'If you\'re away for a week' }
  ];

  // "Biggest risk" = the first area in this order that is missing; if none, the first that depends on a person.
  var RISK_ORDER = ['cash','purchase','kitchen','storage','prep','service','review'];

  // System level from the number of systemized areas (out of 7).
  var LEVELS = [
    { min:6, n:3, name:'System-run' },
    { min:3, n:2, name:'Partly systemized' },
    { min:0, n:1, name:'Person-run' }
  ];

  // Sample maps shown on the landing page (one picked at random).
  var SAMPLES = [
    { title:'A 60-cover dine-in', format:'dinein', answers:{ purchase:1, storage:1, prep:1, kitchen:0, service:1, cash:0, review:1 }, key:{ person:'chef', areas:['purchase','storage','prep','kitchen'], none:false } },
    { title:'A 2-outlet QSR',     format:'qsr',    answers:{ purchase:2, storage:1, prep:1, kitchen:2, service:0, cash:1, review:0 }, key:{ person:'manager', areas:['storage','service','cash'], none:false } },
    { title:'A cloud kitchen on two apps', format:'cloud', answers:{ purchase:1, storage:0, prep:1, kitchen:1, service:1, cash:0, review:0 }, key:{ person:'owner', areas:['purchase','prep','kitchen','service'], none:false } }
  ];

  // Call booking: time windows (keep the HH:MM start, the app sorts by it).
  var SLOTS = [ { v:'10:00 – 12:00 (morning)', l:'Morning' }, { v:'12:00 – 16:00 (afternoon)', l:'Afternoon' }, { v:'16:00 – 20:00 (evening)', l:'Evening' } ];
  var BOOK_DAYS = 6;

  /* ============================== ENGINE ============================== */

  var db = null;
  try{
    var fbApp = firebase.initializeApp({
      apiKey: "AIzaSyBbEjsvTcWKqQs5pGsSdVYTxWtwKdr3zcU",
      authDomain: "diahnosis-room.firebaseapp.com",
      projectId: "diahnosis-room",
      storageBucket: "diahnosis-room.firebasestorage.app",
      messagingSenderId: "197732013160",
      appId: "1:197732013160:web:86f938ffbabb1858fa57dd"
    }, 'systemmap');
    db = fbApp.firestore();
  }catch(e){ db = null; }

  function areasFor(format){
    return AREAS.map(function(a){
      if (!a.byFormat) return a;
      var v = a.byFormat[format] || a.byFormat.dinein;
      if (typeof v === 'string') v = a.byFormat[v];
      return { id:a.id, name:v.name, risk:v.risk, q:v.q, opts:v.opts };
    });
  }
  function deptName(d, format){ return typeof d.name==='string' ? d.name : (d.name[format]||d.name.dinein); }
  function personOf(id){ return KEY_PEOPLE.filter(function(p){ return p.id===id; })[0] || KEY_PEOPLE[0]; }
  var TOTAL_STEPS = AREAS.length + 2;

  var LS = 'dr_systemmap_v2';
  function load(){ try{ var v = localStorage.getItem(LS); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function save(){ try{ localStorage.setItem(LS, JSON.stringify(st)); }catch(e){} }
  function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
  function fresh(){ return { step:'landing', format:'', answers:{}, key:{ person:'chef', areas:[], none:false }, mapId:newId(), savedKey:'', booking:{ name:'', phone:'', day:'', slot:'' }, booked:null }; }

  var st = load() || fresh();
  var sampleIdx = Math.floor(Math.random()*SAMPLES.length);
  var app = document.getElementById('app');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function isoDay(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function plural(n, one, many){ return n+' '+(n===1?one:many); }

  // ---- diagnosis ----
  function diagnose(s){
    var areas = areasFor(s.format);
    var person = personOf(s.key.person);
    var slipped = s.key.none ? [] : s.key.areas;
    var map = areas.map(function(a){
      var lv = s.answers[a.id];
      var base = lv===2 ? 'system' : (lv===1 ? 'person' : 'missing');
      var hit = slipped.indexOf(a.id) >= 0;
      var status = (base==='system' && hit) ? 'person' : base;   // the absence test overrides a "system" answer
      var ans = ''; a.opts.forEach(function(o){ if (o[0]===lv) ans = o[1]; });
      var dept = ''; DEPTS.forEach(function(d){ if (d.areas.indexOf(a.id)>=0) dept = deptName(d, s.format); });
      return { id:a.id, name:a.name, dept:dept, status:status, risk:a.risk,
        who: status==='system' ? 'Systemized' : (status==='missing' ? 'Missing' : (hit ? 'Runs on '+(person.id==='owner'?'you':person.label.toLowerCase()) : 'Runs on someone\'s memory')),
        subs:[{ label:a.name, answer:ans, status:base }] };
    });
    var counts = { system:0, person:0, missing:0 };
    map.forEach(function(m){ counts[m.status]++; });
    var level = LEVELS.filter(function(l){ return counts.system >= l.min; })[0];
    var byId = {}; map.forEach(function(m){ byId[m.id] = m; });
    var risk = null;
    ['missing','person'].some(function(want){
      return RISK_ORDER.some(function(id){ if (byId[id] && byId[id].status===want){ risk = byId[id]; return true; } return false; });
    });
    var keyLine = slipped.length
      ? person.line+', '+plural(slipped.length,'area slips','areas slip')+': '+slipped.map(function(id){ return byId[id] ? byId[id].name.toLowerCase() : id; }).join(', ')+'.'
      : person.line+', nothing slips. That\'s rare.';
    var headline = 'Level '+level.n+' of 3 · '+level.name+' — '+counts.system+' of '+map.length+' areas run on a system.';
    return { map:map, counts:counts, level:level, risk:risk, keyLine:keyLine, slipped:slipped.length, headline:headline, format:s.format };
  }

  // ---- saving (create-only documents; the page never reads anything back) ----
  function payloadBase(r){
    return {
      v:2, mapId:st.mapId, format:st.format,
      answers:JSON.parse(JSON.stringify(st.answers)),
      keyPerson:{ person:st.key.person, areas:st.key.none ? [] : st.key.areas.slice(0,10) },
      map:r.map.map(function(m){ return { id:m.id, name:m.name, dept:m.dept, status:m.status, who:m.who, subs:m.subs }; }),
      counts:r.counts, level:r.level.n,
      risk:r.risk ? r.risk.risk : '',
      headline:(r.headline+' '+r.keyLine).slice(0,300),
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    };
  }
  function writeDoc(data){
    if (!db) return Promise.reject(new Error('offline'));
    var ref = db.collection('systemMaps').doc(newId());
    return new Promise(function(resolve, reject){
      var timer = setTimeout(function(){ reject(new Error('timeout')); }, 15000);
      ref.set(data).then(function(){ clearTimeout(timer); resolve(); }, function(e){ clearTimeout(timer); reject(e); });
    });
  }
  function saveMapOnce(r){
    var k = JSON.stringify([st.format, st.answers, st.key]);
    if (st.savedKey===k) return;
    var data = payloadBase(r); data.kind = 'map';
    writeDoc(data).then(function(){ st.savedKey = k; save(); }, function(){});
  }

  // ---- hierarchy board ----
  var DOT = { system:'ok', person:'warn', missing:'bad' };
  function groupByDept(r){
    var byId = {}; r.map.forEach(function(m){ byId[m.id] = m; });
    return DEPTS.map(function(d){ return { name:deptName(d, r.format), areas:d.areas.map(function(a){ return byId[a]; }).filter(Boolean) }; });
  }
  function deptCounts(areas){
    var p = areas.filter(function(a){ return a.status==='person'; }).length;
    var m = areas.filter(function(a){ return a.status==='missing'; }).length;
    if (!p && !m) return 'All systemized';
    return [m ? '<span class="bad">'+m+' missing</span>' : '', p ? '<span class="warn">'+p+' on people</span>' : ''].filter(Boolean).join(' · ');
  }
  function rootNode(r, title){
    return '<div class="n root" data-node="root"><div class="t1">'+esc(title)+'</div><div class="t2">'+esc(FORMATS[r.format].label)+' · '+r.counts.system+' of '+r.map.length+' systemized</div></div>';
  }
  function deptNode(g, i){ return '<div class="n dept" data-node="d'+i+'"><div class="t1">'+esc(g.name)+'</div><div class="t2 cnt">'+deptCounts(g.areas)+'</div></div>'; }
  function areaNode(a, di){ return '<div class="n area s-'+a.status+'" data-node="a'+di+'"><div class="t1">'+esc(a.name)+'</div><div class="t2">'+esc(a.who)+'</div></div>'; }
  function leafNode(a){ return '<div class="n leaf"><div class="t2">'+esc(a.subs[0].answer)+'</div></div>'; }

  function boardH(r, o){
    var groups = groupByDept(r);
    return '<div class="hwrap"><div class="ht"><svg class="wires" aria-hidden="true"></svg>' +
      '<div class="rootcell">'+rootNode(r, o.title)+'</div>' +
      groups.map(function(g, i){ return '<div class="deptcell" style="grid-column:span '+g.areas.length+';">'+deptNode(g, i)+'</div>'; }).join('') +
      groups.map(function(g, i){ return g.areas.map(function(a){
        return '<div class="areacell">'+areaNode(a, i)+(o.leaves ? '<div class="leafwrap">'+leafNode(a)+'</div>' : '')+'</div>';
      }).join(''); }).join('') +
    '</div></div>';
  }
  function boardV(r, o){
    var groups = groupByDept(r);
    return '<div class="vt">'+rootNode(r, o.title)+'<div class="kids">' +
      groups.map(function(g, i){
        return '<div class="item">'+deptNode(g, i)+'<div class="kids">' +
          g.areas.map(function(a){
            return '<div class="item">'+areaNode(a, i)+(o.leaves ? '<div class="kids"><div class="item">'+leafNode(a)+'</div></div>' : '')+'</div>';
          }).join('') + '</div></div>';
      }).join('') + '</div></div>';
  }
  var H_WIDTH = 1134, H_MIN_SCALE = 0.74;
  function offsetIn(el, root){ var x = 0, y = 0; while (el && el!==root){ x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return { x:x, y:y }; }
  var boardSpec = null, boardMode = '';
  function layoutBoard(){
    var board = app.querySelector('.board'); if (!board || !boardSpec) return;
    var avail = board.clientWidth - 36;
    var mode = avail/H_WIDTH >= H_MIN_SCALE ? 'h' : 'v';
    if (mode!==boardMode || !board.firstChild){ board.innerHTML = mode==='h' ? boardH(boardSpec.r, boardSpec) : boardV(boardSpec.r, boardSpec); boardMode = mode; }
    if (mode!=='h') return;
    var wrap = board.querySelector('.hwrap'), ht = board.querySelector('.ht'), svg = ht.querySelector('svg.wires');
    ht.style.transform = 'none';
    function pt(node, where){ var o = offsetIn(node, ht); return { x:o.x + node.offsetWidth/2, y: where==='top' ? o.y : o.y + node.offsetHeight }; }
    function elbow(a, b){ var my = (a.y + b.y)/2; return 'M'+a.x+','+a.y+' V'+my+' H'+b.x+' V'+b.y; }
    var root = ht.querySelector('[data-node="root"]'), depts = ht.querySelectorAll('.n.dept'), paths = [];
    for (var i=0; i<depts.length; i++){
      paths.push(elbow(pt(root,'bottom'), pt(depts[i],'top')));
      var areas = ht.querySelectorAll('[data-node="a'+i+'"]');
      for (var j=0; j<areas.length; j++) paths.push(elbow(pt(depts[i],'bottom'), pt(areas[j],'top')));
    }
    svg.setAttribute('width', ht.offsetWidth); svg.setAttribute('height', ht.offsetHeight);
    svg.innerHTML = paths.map(function(d){ return '<path d="'+d+'"/>'; }).join('');
    var s = Math.min(1, avail/H_WIDTH);
    ht.style.transform = 'scale('+s+')';
    ht.style.marginLeft = s===1 ? ((avail-H_WIDTH)/2)+'px' : '0';
    wrap.style.height = Math.ceil(ht.offsetHeight*s)+'px';
  }
  var resizeT = null;
  window.addEventListener('resize', function(){ clearTimeout(resizeT); resizeT = setTimeout(layoutBoard, 120); });

  function findings(r){
    var out = '';
    if (r.risk) out += '<div class="finding"><i class="dot bad"></i><div><b>Biggest risk · '+esc(r.risk.name)+'.</b> '+esc(r.risk.risk)+'</div></div>';
    out += '<div class="finding"><i class="dot '+(r.slipped ? 'warn' : 'ok')+'"></i><div>'+esc(r.keyLine)+'</div></div>';
    return out;
  }
  function levelBlock(r){
    return '<div class="level"><div class="meter" aria-hidden="true">'+[1,2,3].map(function(n){ return '<i class="'+(n<=r.level.n?'on':'')+'"></i>'; }).join('')+'</div>' +
      '<div><div class="eyebrow">System level</div><div class="lv">Level '+r.level.n+' · '+esc(r.level.name)+'</div></div></div>' +
      '<p class="lead" style="margin-top:8px;">'+r.counts.system+' of '+r.map.length+' areas run on a system. '+
        (r.counts.person ? plural(r.counts.person,'depends','depend')+' on people' : '')+(r.counts.person && r.counts.missing ? ', and ' : '')+(r.counts.missing ? plural(r.counts.missing,'has','have')+' nobody handling '+(r.counts.missing===1?'it':'them') : '')+(r.counts.person||r.counts.missing ? '.' : '')+'</p>';
  }
  function legend(){ return '<div class="legend"><span><i class="dot ok"></i>Systemized</span><span><i class="dot warn"></i>Depends on a person</span><span><i class="dot bad"></i>Missing</span></div>'; }

  // ---- screens ----
  var TICK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
  var SITE = 'https://abhishekand1111-prog.github.io/system-map/';
  var stepIdx = function(){ var m = /^q(\d+)$/.exec(st.step); return m ? parseInt(m[1],10) : -1; };

  function viewLanding(){
    var smp = SAMPLES[sampleIdx];
    var r = diagnose({ format:smp.format, answers:smp.answers, key:smp.key });
    boardSpec = { r:r, title:smp.title, leaves:false };
    return '<div class="hero"><div class="eyebrow" style="margin-bottom:10px;">Free restaurant check</div><h1>Does your restaurant run on a system, or on people?</h1>' +
      '<p class="lead">Answer 9 quick questions and get a map of your operation, from supply to management, showing which parts run on a system and which stop when one person is away.</p>' +
      '<div class="cta" style="justify-content:flex-start;"><button class="btn btn-primary" data-a="begin">Check my restaurant · 60 seconds</button></div>' +
      '<div class="trust">'+['Free','9 taps, no typing','No sales figures asked','Anonymous'].map(function(x){ return '<span>'+TICK+esc(x)+'</span>'; }).join('')+'</div></div>' +
      '<div style="margin-top:34px; display:flex; justify-content:space-between; align-items:center; gap:10px;"><span class="sample-tag">Sample map</span>' +
        '<button class="btn-text" data-a="sample">Show another example →</button></div>' +
      '<div style="font-size:19px; font-weight:800; margin-top:10px;">'+esc(smp.title)+' · Level '+r.level.n+', '+esc(r.level.name)+'</div>' +
      '<p class="muted" style="margin-top:4px; font-size:14px;">'+esc(r.keyLine)+'</p>' +
      legend() +
      '<div class="board" role="img" aria-label="Sample system map"></div>';
  }

  function qFrame(i, inner){
    return '<div class="progress"><i style="width:'+Math.round((i/TOTAL_STEPS)*100)+'%"></i></div>' +
      '<div class="qhead"><span class="eyebrow">'+(i+1)+' of '+TOTAL_STEPS+'</span>' +
      '<button class="btn-text" data-a="back">← Back</button></div>' + inner;
  }
  function viewQuestion(i){
    if (i===0){
      return qFrame(0, '<div class="qtext">What kind of place do you run?</div>' +
        Object.keys(FORMATS).map(function(k){
          return '<button class="opt '+(st.format===k?'on':'')+'" data-a="fmt" data-v="'+k+'"><b>'+FORMATS[k].label+'</b><span>'+FORMATS[k].hint+'</span></button>';
        }).join(''));
    }
    var areas = areasFor(st.format);
    if (i <= areas.length){
      var a = areas[i-1];
      var dept = ''; DEPTS.forEach(function(d){ if (d.areas.indexOf(a.id)>=0) dept = deptName(d, st.format); });
      return qFrame(i, '<div class="eyebrow" style="margin-top:14px; color:var(--ink);">'+esc(dept)+' · '+esc(a.name)+'</div>' +
        '<div class="qtext">'+esc(a.q)+'</div>' +
        a.opts.map(function(o){ return '<button class="opt '+(st.answers[a.id]===o[0]?'on':'')+'" data-a="ans" data-k="'+a.id+'" data-v="'+o[0]+'">'+esc(o[1])+'</button>'; }).join(''));
    }
    var p = personOf(st.key.person);
    return qFrame(i, '<div class="eyebrow" style="margin-top:14px; color:var(--ink);">Last one · the key-person test</div>' +
      '<div class="sublab">Who is most important day to day?</div>' +
      '<div class="chips">'+KEY_PEOPLE.map(function(k){ return '<button class="chip '+(st.key.person===k.id?'on':'')+'" data-a="kp" data-v="'+k.id+'">'+esc(k.label)+'</button>'; }).join('')+'</div>' +
      '<div class="qtext" style="margin-top:20px;">'+esc(p.ask)+'</div>' +
      '<div class="muted" style="margin:-8px 0 12px;">Tap everything that would slip.</div>' +
      '<div class="chips">'+areas.map(function(a){ return '<button class="chip '+(!st.key.none && st.key.areas.indexOf(a.id)>=0?'on':'')+'" data-a="ka" data-v="'+a.id+'">'+esc(a.name)+'</button>'; }).join('') +
        '<button class="chip '+(st.key.none?'on':'')+'" data-a="knone">Nothing, it would run fine</button></div>' +
      '<div class="cta" style="justify-content:flex-start;"><button class="btn btn-primary" data-a="finish" '+((st.key.none||st.key.areas.length)?'':'disabled')+'>See my system map</button></div>');
  }

  function viewResult(){
    var r = diagnose(st);
    saveMapOnce(r);
    boardSpec = { r:r, title:'Your restaurant', leaves:true };
    var today = new Date().toLocaleDateString('en-IN',{ day:'numeric', month:'short', year:'numeric' });
    return '<div class="report-head"><span class="eyebrow" style="color:var(--ink);">Your System Map</span><span class="eyebrow">'+esc(FORMATS[st.format].label)+' · '+esc(today)+'</span></div>' +
      levelBlock(r) + findings(r) + legend() +
      '<div class="board" role="img" aria-label="Your restaurant as a hierarchy of departments and areas"></div>' +
      '<div class="card">' +
        '<div class="eyebrow" style="color:var(--ink);">Free Snapshot Call · 20 minutes</div>' +
        '<div style="font-size:20px; font-weight:800; margin-top:6px; line-height:1.3;">Want to know what to fix first?</div>' +
        '<ul class="perks">' +
          '<li>'+TICK+'<span>We go through this map with you, area by area.</span></li>' +
          '<li>'+TICK+'<span>We point out which gap is most likely costing you money.</span></li>' +
          '<li>'+TICK+'<span>No charge and no obligation. Your answers are already with us.</span></li>' +
        '</ul>' +
        '<div class="cta" style="margin-top:18px;"><button class="btn btn-primary" data-a="to" data-v="book">Book my free Snapshot Call</button></div>' +
      '</div>' +
      '<div class="after">' +
        '<a class="btn-text" href="https://wa.me/?text='+encodeURIComponent('Does your restaurant run on a system, or on people? Free 60-second check: '+SITE)+'" target="_blank" rel="noopener">Send this check to another owner</a>' +
        '<button class="btn-text" data-a="restart">Start over</button>' +
      '</div>';
  }

  function bookDays(){
    var out = [];
    for (var i=1; i<=BOOK_DAYS; i++){
      var d = new Date(); d.setDate(d.getDate()+i);
      out.push({ v:isoDay(d), l: i===1 ? 'Tomorrow' : d.toLocaleDateString('en-IN',{ weekday:'short', day:'numeric' }) });
    }
    return out;
  }
  function normPhone(v){
    var d = String(v||'').replace(/[\s\-().]/g,'');
    if (/^\+91/.test(d)) d = d.slice(3); else if (/^91\d{10}$/.test(d)) d = d.slice(2); else if (/^0\d{10}$/.test(d)) d = d.slice(1);
    return d;
  }
  function bookingProblems(b){
    var p = {};
    if (!String(b.name||'').trim()) p.name = 'Enter your name.';
    if (!/^[6-9]\d{9}$/.test(normPhone(b.phone))) p.phone = 'Enter a valid 10-digit mobile number.';
    if (!bookDays().some(function(d){ return d.v===b.day; })) p.day = 'Pick a day.';
    if (!SLOTS.some(function(s){ return s.v===b.slot; })) p.slot = 'Pick a time.';
    return p;
  }
  function viewBook(){
    var b = st.booking;
    return '<div class="eyebrow">Free Snapshot Call · 20 minutes</div>' +
      '<h2 style="font-size:26px; margin-top:6px;">When should we call you?</h2>' +
      '<p class="lead" style="font-size:15px;">We\'ll go through your map with you. Your answers are already with us.</p>' +
      '<div class="two">' +
        '<div><label class="f" for="bname">Your name</label><input class="t" id="bname" data-b="name" maxlength="80" autocomplete="name" value="'+esc(b.name)+'"><div class="err" data-e="name"></div></div>' +
        '<div><label class="f" for="bphone">Mobile number</label><input class="t" id="bphone" data-b="phone" type="tel" inputmode="tel" maxlength="16" autocomplete="tel" value="'+esc(b.phone)+'" placeholder="10-digit mobile"><div class="err" data-e="phone"></div></div>' +
      '</div>' +
      '<div class="sublab">Day</div><div class="chips">'+bookDays().map(function(d){ return '<button class="chip '+(b.day===d.v?'on':'')+'" data-a="day" data-v="'+d.v+'">'+esc(d.l)+'</button>'; }).join('')+'</div><div class="err" data-e="day"></div>' +
      '<div class="sublab">Time</div><div class="chips">'+SLOTS.map(function(s){ return '<button class="chip '+(b.slot===s.v?'on':'')+'" data-a="slot" data-v="'+esc(s.v)+'">'+esc(s.l)+'</button>'; }).join('')+'</div><div class="err" data-e="slot"></div>' +
      '<div class="err" data-e="send"></div>' +
      '<div class="cta" style="justify-content:space-between; align-items:center;"><button class="btn-text" data-a="to" data-v="result">← Back to my map</button>' +
      '<button class="btn btn-primary" data-a="send" style="min-width:200px;">Request call</button></div>';
  }
  function viewBooked(){
    var b = st.booked || {};
    var day = ''; try{ day = new Date(b.day+'T00:00:00').toLocaleDateString('en-IN',{ weekday:'long', day:'numeric', month:'long' }); }catch(e){}
    var slot = (SLOTS.filter(function(s){ return s.v===b.slot; })[0] || {}).l || '';
    return '<div class="done-ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>' +
      '<h2 style="font-size:26px;">Request received</h2>' +
      '<p class="lead">We\'ll call you on <b>'+esc(day)+'</b>, '+esc(slot.toLowerCase())+', on '+esc(b.phone||'')+'.</p>' +
      '<div class="cta" style="justify-content:flex-start; gap:10px; flex-wrap:wrap;"><button class="btn" data-a="to" data-v="result">View my map</button><a class="btn" href="../" style="text-decoration:none;">How we work →</a></div>';
  }

  function render(){
    var h, i = stepIdx();
    boardSpec = null; boardMode = '';
    if (st.step==='landing') h = viewLanding();
    else if (i>=0) h = viewQuestion(Math.min(i, TOTAL_STEPS-1));
    else if (st.step==='result' && st.format) h = viewResult();
    else if (st.step==='book' && st.format) h = viewBook();
    else if (st.step==='booked') h = viewBooked();
    else { st.step = 'landing'; h = viewLanding(); }
    app.innerHTML = '<div class="fade">'+h+'</div>';
    layoutBoard();
    save();
  }
  function go(step){ st.step = step; render(); window.scrollTo(0,0); }
  var advancing = false;
  function advance(){
    if (advancing) return; advancing = true;
    setTimeout(function(){ advancing = false; go('q'+(stepIdx()+1)); }, 230);
  }
  function showErrors(p){ ['name','phone','day','slot','send'].forEach(function(k){ var el = app.querySelector('[data-e="'+k+'"]'); if (el) el.textContent = p[k]||''; }); }

  app.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-a]'); if (!t || advancing) return;
    var a = t.dataset.a;
    if (a==='begin'){ go('q0'); }
    else if (a==='sample'){ sampleIdx = (sampleIdx+1) % SAMPLES.length; render(); }
    else if (a==='back'){ var i = stepIdx(); go(i<=0 ? 'landing' : 'q'+(i-1)); }
    else if (a==='fmt'){
      if (st.format && st.format!==t.dataset.v){ st.answers = {}; st.key = { person:st.key.person, areas:[], none:false }; }
      st.format = t.dataset.v; render(); advance();
    }
    else if (a==='ans'){ st.answers[t.dataset.k] = parseInt(t.dataset.v,10); render(); advance(); }
    else if (a==='kp'){ st.key.person = t.dataset.v; render(); }
    else if (a==='ka'){
      var id = t.dataset.v, list = st.key.areas, at = list.indexOf(id);
      st.key.none = false;
      if (at>=0) list.splice(at,1); else list.push(id);
      render();
    }
    else if (a==='knone'){ st.key.none = !st.key.none; if (st.key.none) st.key.areas = []; render(); }
    else if (a==='finish'){ go('result'); }
    else if (a==='restart'){ var keep = st.booking; st = fresh(); st.booking = keep; go('landing'); }
    else if (a==='to'){ go(t.dataset.v); }
    else if (a==='day'){ st.booking.day = t.dataset.v; render(); }
    else if (a==='slot'){ st.booking.slot = t.dataset.v; render(); }
    else if (a==='send'){
      var b = st.booking, p = bookingProblems(b);
      showErrors(p);
      if (Object.keys(p).length){ var first = app.querySelector('[data-b="'+Object.keys(p)[0]+'"]'); if (first) first.focus(); return; }
      t.disabled = true; t.textContent = 'Sending…';
      var data = payloadBase(diagnose(st));
      data.kind = 'call';
      data.status = 'new';
      data.contact = { name:String(b.name).trim().slice(0,80), phone:normPhone(b.phone), date:b.day, slot:b.slot };
      writeDoc(data).then(function(){
        st.booked = { phone:data.contact.phone, day:b.day, slot:b.slot };
        go('booked');
      }, function(){
        t.disabled = false; t.textContent = 'Request call';
        showErrors({ send:'Couldn\'t send right now. Check your connection and try again.' });
      });
    }
  });
  app.addEventListener('input', function(ev){
    var t = ev.target;
    if (t.dataset.b){ st.booking[t.dataset.b] = t.value; save(); var e = app.querySelector('[data-e="'+t.dataset.b+'"]'); if (e) e.textContent = ''; }
  });

  // A finished or booked visit reopens on its map; anything half-done restarts from the landing page.
  if (st.step!=='result' && st.step!=='booked' && st.step!=='book') st.step = 'landing';
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ boardMode = ''; layoutBoard(); });
})();
</script>
</body>
